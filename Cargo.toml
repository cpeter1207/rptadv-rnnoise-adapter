[package]
name = "rptadv-rnnoise-adapter"
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.85"
license = "GPL-2.0-only"
description = "RNNoise adapter for rpt_advanced"
homepage = "https://github.com/cpeter1207/rptadv-rnnoise-adapter"
repository = "https://github.com/cpeter1207/rptadv-rnnoise-adapter"
